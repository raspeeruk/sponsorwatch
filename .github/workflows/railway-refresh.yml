# Paused 28 Sep 2026 — site down / Railway bill; re-enable only if Sponsor Watch is deliberately brought back.
name: Refresh Sponsor Watch on Railway

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsorwatch-railway-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Request a Railway rebuild
        run: |
          mkdir -p .data-refresh
          mkdir -p public
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"requested_at":"%s"}\n' "$requested_at" > .data-refresh/last-run.json
          printf 'Railway refresh requested at %s\n' "$requested_at" > public/railway-refresh.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .data-refresh/last-run.json public/railway-refresh.txt
          git diff --staged --quiet || git commit -m "chore: request Railway data refresh [skip netlify]"
          git push
